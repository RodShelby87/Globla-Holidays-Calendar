function classify(types){const t=types.join(' ').toLowerCase();if(t.includes('observance'))return'Observance';if(t.includes('optional'))return'Optional';if(t.includes('bank'))return'Bank holiday';if(t.includes('school'))return'School holiday';return'Public holiday'}
function showPopup(el,name,codes,date){if(activeLabel===el&&popup.classList.contains('visible'))return closePopup();closePopup();activeLabel=el;el.classList.add('active');const d=holidayDetails[date]?.[name]||{sources:[],types:[],states:[],description:''},countries=codes.map(x=>countryData.find(c=>c.code===x)?.name||x);popupTitle.textContent=name;popupMeta.innerHTML=`<span class="popup-tag date">${formatDate(date)}</span>`+countries.map(x=>`<span class="popup-tag country">${x}</span>`).join('');popupBody.innerHTML=`<p style="margin:0 0 7px"><strong>${classify(d.types)}</strong></p><p style="margin:0">${d.description||`${name} is listed for ${countries.join(', ')} by the connected holiday data source${d.sources.length===1?'':'s'}.`}</p>`;popupFooter.textContent=`Sources: ${d.sources.join(' + ')||'Unavailable'}${d.states.length?' | Subdivisions: '+d.states.join(', '):''}`;popup.classList.add('visible');positionPopup(el)}
function renderCalendar(){closePopup();calendarGrid.innerHTML='';const y=+yearSelect.value,m=+monthSelect.value,first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),all=countrySelect.value==='ALL';let cy,cm,cd,display;if(all){const n=new Date;cy=n.getFullYear();cm=n.getMonth()+1;cd=n.getDate();display=n.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' (Local Time)';clockDisplay.style.display='none'}else{const c=countryData.find(x=>x.code===countrySelect.value),parts=new Intl.DateTimeFormat('en-CA',{timeZone:c.zones[0].tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date).split('-').map(Number);[cy,cm,cd]=parts;display=new Date().toLocaleDateString('en-GB',{timeZone:c.zones[0].tz,day:'2-digit',month:'short',year:'numeric'});clockDisplay.style.display='flex';startClocks()}localDateDisplay.textContent=display;const today=`${cy}-${String(cm).padStart(2,'0')}-${String(cd).padStart(2,'0')}`;dailyStatus.textContent=currentHolidays[today]?Object.keys(currentHolidays[today]).join(' | '):'Nothing';for(let i=0;i<first;i++)calendarGrid.insertAdjacentHTML('beforeend','<div class="day-cell empty"></div>');for(let day=1;day<=total;day++){const date=`${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,cell=document.createElement('div');cell.className='day-cell'+(y===cy&&m+1===cm&&day===cd?' today':'')+(selectedDate&&y===selectedDate.year&&m===selectedDate.month&&day===selectedDate.day?' selected-day':'');let list='';for(const[name,codes]of Object.entries(currentHolidays[date]||{})){const sources=holidayDetails[date]?.[name]?.sources||[],dot=sources.length>1?'both':'single';list+=`<div class="holiday-label" data-name="${name.replace(/"/g,'&quot;')}" data-date="${date}" data-codes="${codes.join(',')}">${name}${all?`<span class="country-tag">(${codes.join(',')})</span>`:''}<i class="source-dot ${dot}" title="${sources.join(' + ')}"></i></div>`}cell.innerHTML=`<div class="day-number">${day}</div><div class="holiday-list">${list}</div>`;calendarGrid.appendChild(cell)}calendarGrid.querySelectorAll('.holiday-label').forEach(el=>el.onclick=e=>{e.stopPropagation();showPopup(el,el.dataset.name,el.dataset.codes.split(','),el.dataset.date)});updateNavTitle()}
function startClocks(){clearInterval(clockInterval);if(countrySelect.value==='ALL')return;const c=countryData.find(x=>x.code===countrySelect.value),tick=()=>clockDisplay.innerHTML=c.zones.map(z=>`<div class="clock-item"><div class="clock-time">${new Date().toLocaleTimeString('en-GB',{timeZone:z.tz,hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="clock-label">${z.label}</div></div>`).join('');tick();clockInterval=setInterval(tick,1000)}
const dp=$('datepickerPanel');let dpState={year:new Date().getFullYear(),month:new Date().getMonth()};$('datepickerBtn').onclick=e=>{e.stopPropagation();dpState={year:+yearSelect.value,month:+monthSelect.value};renderDP();dp.classList.toggle('open')};function renderDP(){const{year:y,month:m}=dpState,first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),now=new Date;dp.innerHTML=`<div class="dp-header"><button id="dpPrev">&#8249;</button><span class="dp-title">${months[m]} ${y}</span><button id="dpNext">&#8250;</button></div><div class="dp-weekdays"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div><div class="dp-days">${'<div class="dp-day empty"></div>'.repeat(first)}${Array.from({length:total},(_,i)=>`<div class="dp-day${y===now.getFullYear()&&m===now.getMonth()&&i+1===now.getDate()?' dp-today':''}" data-day="${i+1}">${i+1}</div>`).join('')}</div>`;$('dpPrev').onclick=e=>{e.stopPropagation();if(--dpState.month<0){dpState.month=11;dpState.year--}renderDP()};$('dpNext').onclick=e=>{e.stopPropagation();if(++dpState.month>11){dpState.month=0;dpState.year++}renderDP()};dp.querySelectorAll('.dp-day:not(.empty)').forEach(el=>el.onclick=e=>{e.stopPropagation();selectedDate={year:y,month:m,day:+el.dataset.day};if(setYear(y)){monthSelect.value=m;saveSelections();fetchHolidays()}dp.classList.remove('open')})}
$('todayBtn').onclick=()=>{selectedDate=null;const now=new Date;yearSelect.value=now.getFullYear();monthSelect.value=now.getMonth();saveSelections();fetchHolidays()};regionSelect.onchange=()=>{updateCountryList();saveSelections();fetchHolidays()};countrySelect.onchange=()=>{saveSelections();fetchHolidays()};yearSelect.onchange=()=>{saveSelections();fetchHolidays()};monthSelect.onchange=()=>{saveSelections();renderCalendar()};
function init(){applyTheme(localStorage.getItem('user-theme')||'light');const now=new Date;for(let y=now.getFullYear()-1;y<=now.getFullYear()+4;y++)yearSelect.add(new Option(y,y));months.forEach((x,i)=>monthSelect.add(new Option(x,i)));const s=saved();regionSelect.value=s?.region||'Americas';updateCountryList();countrySelect.value=[...countrySelect.options].some(o=>o.value===s?.country)?s.country:'AR';yearSelect.value=[...yearSelect.options].some(o=>o.value===String(s?.year))?s.year:now.getFullYear();monthSelect.value=s?.month??now.getMonth();saveSelections();updateNavTitle();startClocks();fetchHolidays()}init();
</script>
