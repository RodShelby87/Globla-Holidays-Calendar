const countryData=[
['AR','Argentina','Americas','BA','America/Argentina/Buenos_Aires'],['BO','Bolivia','Americas','LP','America/La_Paz'],['BR','Brazil','Americas','BSB','America/Sao_Paulo'],['CA','Canada','Americas','TOR','America/Toronto'],['CL','Chile','Americas','SCL','America/Santiago'],['CO','Colombia','Americas','BOG','America/Bogota'],['CR','Costa Rica','Americas','SJO','America/Costa_Rica'],['CU','Cuba','Americas','HAV','America/Havana'],['DO','Dominican Republic','Americas','SDQ','America/Santo_Domingo'],['EC','Ecuador','Americas','UIO','America/Guayaquil'],['GT','Guatemala','Americas','GUA','America/Guatemala'],['JM','Jamaica','Americas','KIN','America/Jamaica'],['MX','Mexico','Americas','MEX','America/Mexico_City'],['PA','Panama','Americas','PTY','America/Panama'],['PY','Paraguay','Americas','ASU','America/Asuncion'],['PE','Peru','Americas','LIM','America/Lima'],['US','United States','Americas','NYC','America/New_York'],['UY','Uruguay','Americas','MVD','America/Montevideo'],['VE','Venezuela','Americas','CCS','America/Caracas'],

['CN','China','Asia','PEK','Asia/Shanghai'],['HK','Hong Kong','Asia','HKG','Asia/Hong_Kong'],['IN','India','Asia','DEL','Asia/Kolkata'],['ID','Indonesia','Asia','JKT','Asia/Jakarta'],['IL','Israel','Asia','TLV','Asia/Jerusalem'],['JP','Japan','Asia','TYO','Asia/Tokyo'],['SA','Saudi Arabia','Asia','RUH','Asia/Riyadh'],['SG','Singapore','Asia','SGP','Asia/Singapore'],['KR','South Korea','Asia','SEL','Asia/Seoul'],['AE','United Arab Emirates','Asia','DXB','Asia/Dubai'],
['DZ','Algeria','Africa','ALG','Africa/Algiers'],['EG','Egypt','Africa','CAI','Africa/Cairo'],['GH','Ghana','Africa','ACC','Africa/Accra'],['KE','Kenya','Africa','NBO','Africa/Nairobi'],['MA','Morocco','Africa','CAS','Africa/Casablanca'],['NG','Nigeria','Africa','LOS','Africa/Lagos'],['ZA','South Africa','Africa','JNB','Africa/Johannesburg'],['AU','Australia','Oceania','SYD','Australia/Sydney'],['NZ','New Zealand','Oceania','AKL','Pacific/Auckland']
].map(([code,name,region,label,tz])=>({code,name,region,zones:[{label,tz}]})).sort((a,b)=>a.name.localeCompare(b.name));

const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const monthsShort=months.map(m=>m.slice(0,3));
const $=id=>document.getElementById(id);
const regionSelect=$('regionSelect'),countrySelect=$('countrySelect'),yearSelect=$('yearSelect'),monthSelect=$('monthSelect'),calendarGrid=$('calendarGrid'),clockDisplay=$('clockDisplay'),dailyStatus=$('dailyStatus'),localDateDisplay=$('localDateDisplay'),navTitle=$('navTitle'),popup=$('holidayPopup'),popupTitle=$('popupTitle'),popupMeta=$('popupMeta'),popupBody=$('popupBody'),popupFooter=$('popupFooter'),deepSearchBtn=$('deepSearchBtn'),fetchNote=$('fetchNote');
let currentHolidays={},holidayDetails={},clockInterval,selectedDate=null,activeLabel=null,fetchRun=0,fetching=false;
const STORAGE_KEY='holiday-calendar-selections',CACHE_PREFIX='holiday-cache-v3',CACHE_TTL=7*86400000;
const hasCalendarificKey=()=>Boolean(CALENDARIFIC_KEY)&&!CALENDARIFIC_KEY.includes('PASTE_');

function cacheKey(provider,country,year){return `${CACHE_PREFIX}:${provider}:${country}:${year}`}
function cacheRead(provider,country,year,allowStale=false){try{const value=JSON.parse(localStorage.getItem(cacheKey(provider,country,year)));return value&&Array.isArray(value.data)&&(allowStale||Date.now()-value.saved<CACHE_TTL)?value.data:null}catch{return null}}
function cacheWrite(provider,country,year,data){try{localStorage.setItem(cacheKey(provider,country,year),JSON.stringify({saved:Date.now(),data}))}catch{}}
async function fetchJson(url){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw new Error(`HTTP ${response.status}`);return await response.json()}finally{clearTimeout(timeout)}}

function normalizeName(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/&/g,' and ').replace(/\b(the|day|holiday|public|national|observed|observance)\b/g,' ').replace(/[^a-z0-9]+/g,' ').trim().replace(/\s+/g,' ')}
function similarity(a,b){const A=new Set(normalizeName(a).split(' ').filter(x=>x.length>1)),B=new Set(normalizeName(b).split(' ').filter(x=>x.length>1));if(!A.size||!B.size)return 0;let overlap=0;A.forEach(x=>B.has(x)&&overlap++);return overlap/Math.max(A.size,B.size)}
function sameHoliday(a,b){const x=normalizeName(a.name),y=normalizeName(b.name);return x===y||(x.length>4&&y.length>4&&(x.includes(y)||y.includes(x)))||similarity(a.name,b.name)>=.8}

function normalizeNager(h){
  const states=Array.isArray(h.counties)?h.counties:[];
  return{date:String(h.date||'').slice(0,10),name:String(h.name||h.localName||'').trim(),description:'',types:Array.isArray(h.types)?h.types:[],states,scope:h.global===false||states.length?'Regional':'National',source:'Nager.Date'};
}
function normalizeCalendarific(h){
  const states=h.states&&h.states!=='All'?[String(h.states)]:[];
  return{date:String(h?.date?.iso||'').slice(0,10),name:String(h?.name||'').trim(),description:String(h?.description||''),types:Array.isArray(h.type)?h.type:[],states,scope:states.length?'Regional':'National',source:'Calendarific'};
}

/* Both getters return {data, failed}. "failed" means the network call errored (not just an empty result). */
async function getNager(country,year){
  const cached=cacheRead('nager',country,year);if(cached)return{data:cached,failed:false};
  try{const raw=await fetchJson(`https://date.nager.at/api/v3/PublicHolidays/${year}/${country}`),data=Array.isArray(raw)?raw.map(normalizeNager).filter(x=>x.date&&x.name):[];cacheWrite('nager',country,year,data);return{data,failed:false}}
  catch{return{data:cacheRead('nager',country,year,true)||[],failed:true}}
}
async function getCalendarific(country,year,allowNetwork=true){
  const cached=cacheRead('calendarific',country,year);if(cached)return{data:cached,failed:false};
  if(!allowNetwork||!hasCalendarificKey())return{data:[],failed:false};
  try{
    const raw=await fetchJson(`https://calendarific.com/api/v2/holidays?api_key=${encodeURIComponent(CALENDARIFIC_KEY)}&country=${country}&year=${year}`),rows=raw?.response?.holidays;
    /* Calendarific can report errors (quota, bad key) inside an HTTP 200. Never cache those. */
    if(raw?.meta?.code!==200||!Array.isArray(rows))throw new Error(`Calendarific error ${raw?.meta?.code??'unknown'}`);
    const data=rows.map(normalizeCalendarific).filter(x=>x.date&&x.name);cacheWrite('calendarific',country,year,data);return{data,failed:false};
  }catch{return{data:cacheRead('calendarific',country,year,true)||[],failed:true}}
}

function mergeLists(...lists){
  const byDate=new Map();
  for(const holiday of lists.flat()){
    if(!byDate.has(holiday.date))byDate.set(holiday.date,[]);
    const row=byDate.get(holiday.date),existing=row.find(item=>sameHoliday(item,holiday));
    if(existing){
      existing.sources=[...new Set([...existing.sources,holiday.source])];
      existing.types=[...new Set([...existing.types,...holiday.types])];
      existing.states=[...new Set([...existing.states,...holiday.states])];
      existing.scopes=[...new Set([...existing.scopes,holiday.scope].filter(Boolean))];
      if(!existing.description&&holiday.description)existing.description=holiday.description;
    }else row.push({...holiday,sources:[holiday.source],scopes:holiday.scope?[holiday.scope]:[]});
  }
  return [...byDate.values()].flat();
}
function applyHoliday(holiday,country){
  currentHolidays[holiday.date]??={};holidayDetails[holiday.date]??={};
  const existingName=Object.keys(currentHolidays[holiday.date]).find(name=>sameHoliday({name},holiday)),name=existingName||holiday.name;
  currentHolidays[holiday.date][name]??=[];
  if(!currentHolidays[holiday.date][name].includes(country))currentHolidays[holiday.date][name].push(country);
  holidayDetails[holiday.date][name]??={sources:[],types:[],states:[],scopes:[],description:''};
  const details=holidayDetails[holiday.date][name];
  details.sources=[...new Set([...details.sources,...holiday.sources])];details.types=[...new Set([...details.types,...holiday.types])];details.states=[...new Set([...details.states,...holiday.states])];details.scopes=[...new Set([...details.scopes,...holiday.scopes])];if(!details.description&&holiday.description)details.description=holiday.description;
}
async function withConcurrency(items,limit,worker){let index=0;await Promise.all(Array.from({length:Math.min(limit,items.length)},async()=>{while(index<items.length){const item=items[index++];await worker(item)}}))}

function getTargets(){
  if(countrySelect.value!=='ALL')return[countryData.find(c=>c.code===countrySelect.value)].filter(Boolean);
  return regionSelect.value==='All'?countryData:countryData.filter(c=>c.region===regionSelect.value);
}

/*
  Normal load (All mode): Nager for everyone; Calendarific only for countries where Nager came back empty.
  Single country or deep search: both sources for every target.
*/
async function fetchHolidays(deep=false){
  const run=++fetchRun;fetching=true;updateDeepButton();
  const loading=$('loading');loading.textContent=deep?'🔍 Running deeper search across both sources...':'📡 Gathering and comparing holiday data...';loading.style.display='block';
  currentHolidays={};holidayDetails={};
  const year=yearSelect.value,isAll=countrySelect.value==='ALL',targets=getTargets(),bothUpfront=!isAll||deep;
  const report={empty:[],gapFilled:[],errors:[]};
  await withConcurrency(targets,deep?3:6,async country=>{
    const [nager,early]=await Promise.all([getNager(country.code,year),bothUpfront?getCalendarific(country.code,year,true):null]);
    const calendarific=early||await getCalendarific(country.code,year,nager.data.length===0);
    if(run!==fetchRun)return;
    if(isAll&&!deep&&!nager.data.length&&calendarific.data.length)report.gapFilled.push(country.code);
    if(!nager.data.length&&!calendarific.data.length)(nager.failed||calendarific.failed?report.errors:report.empty).push(country.code);
    mergeLists(nager.data,calendarific.data).forEach(h=>applyHoliday(h,country.code));
  });
  if(run===fetchRun){fetching=false;renderCalendar();loading.style.display='none';updateNavTitle();updateFetchNote(report,{deep,isAll,count:targets.length});updateDeepButton()}
}

function updateFetchNote({empty,gapFilled,errors},{deep,isAll,count}){
  const messages=[];let warn=false;
  if(errors.length){warn=true;messages.push(`⚠️ Couldn't load ${errors.join(', ')} (network or API error). ${deep||!isAll?'Try again in a bit.':'Try Deeper search.'}`)}
  if(empty.length){warn=true;messages.push(`No holidays found for ${empty.join(', ')} in either source.`)}
  if(!messages.length&&deep)messages.push(`✅ Deeper search done: ${count} ${count===1?'country':'countries'} checked against both sources.`);
  if(gapFilled.length)messages.push(`ℹ️ Filled gaps from Calendarific for ${gapFilled.join(', ')}.`);
  fetchNote.textContent=messages.join(' ');fetchNote.classList.toggle('warn',warn);
}

/* Only shown in All-countries mode — single-country view already queries both sources. */
function uncachedCalendarificCount(){const year=yearSelect.value;return getTargets().filter(c=>!cacheRead('calendarific',c.code,year)).length}
function updateDeepButton(){
  const isAll=countrySelect.value==='ALL';deepSearchBtn.style.display=isAll?'':'none';if(!isAll)return;
  if(!hasCalendarificKey()){deepSearchBtn.disabled=true;deepSearchBtn.textContent='🔍 Deeper search';deepSearchBtn.title='Add a Calendarific API key to enable deeper search';return}
  if(fetching){deepSearchBtn.disabled=true;deepSearchBtn.textContent='🔍 Searching...';return}
  const pending=uncachedCalendarificCount();
  deepSearchBtn.disabled=pending===0;
  deepSearchBtn.textContent=pending===0?'✅ Fully checked':`🔍 Deeper search (${pending} API ${pending===1?'call':'calls'})`;
  deepSearchBtn.title=pending===0?'Every country in this view has already been checked against both sources':'Check every country in this view against both holiday sources';
}
deepSearchBtn.onclick=()=>{
  const pending=uncachedCalendarificCount();
  if(pending>DEEP_CONFIRM_THRESHOLD&&!confirm(`Deeper search will use about ${pending} Calendarific API calls. Results are cached for 7 days. Continue?`))return;
  fetchHolidays(true);
};

function holidayCategory(types){const t=types.join(' ').toLowerCase();if(t.includes('observance'))return'Observance';if(t.includes('optional'))return'Optional holiday';if(t.includes('bank'))return'Bank holiday';if(t.includes('school'))return'School holiday';if(t.includes('authorities'))return'Government / authorities holiday';if(t.includes('public')||t.includes('national'))return'Public holiday';return types[0]||'Holiday'}
function holidayWorkability(types){const t=types.join(' ').toLowerCase();if(/public|national|bank|authorities/.test(t))return{label:'Non-workable',className:'nonwork',detail:'Normally treated as a non-working holiday.'};if(/observance|optional/.test(t))return{label:'Workable',className:'work',detail:'Normally does not imply a general workplace closure.'};if(/school/.test(t))return{label:'Varies',className:'varies',detail:'May affect schools without closing workplaces generally.'};return{label:'Not specified',className:'varies',detail:'The connected sources do not clearly specify workability.'}}
function holidayScope(details){if(details.states.length||details.scopes.includes('Regional'))return'Regional';if(details.scopes.includes('National'))return'National';return'Not specified'}

function updateCountryList(){const previous=countrySelect.value,list=regionSelect.value==='All'?countryData:countryData.filter(c=>c.region===regionSelect.value);countrySelect.innerHTML='<option value="ALL">-- All Countries --</option>'+list.map(c=>`<option value="${c.code}">${c.name}</option>`).join('');if([...countrySelect.options].some(o=>o.value===previous))countrySelect.value=previous}
function saveSelections(){localStorage.setItem(STORAGE_KEY,JSON.stringify({region:regionSelect.value,country:countrySelect.value,year:yearSelect.value,month:monthSelect.value}))}
function loadSelections(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))}catch{return null}}
function applyTheme(theme){document.documentElement.setAttribute('data-theme',theme==='dark'?'dark':'');localStorage.setItem('holiday-theme',theme)}
$('darkModeToggle').onclick=()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
function updateNavTitle(){navTitle.textContent=`${months[+monthSelect.value]} ${yearSelect.value}`}
function setYear(year){if([...yearSelect.options].some(o=>+o.value===year)){yearSelect.value=year;return true}return false}
function moveMonth(step){let month=+monthSelect.value+step,year=+yearSelect.value;if(month<0){month=11;year--}if(month>11){month=0;year++}if(setYear(year)){monthSelect.value=month;saveSelections();fetchHolidays()}}
$('prevMonth').onclick=()=>moveMonth(-1);$('nextMonth').onclick=()=>moveMonth(1);

function closePopup(){popup.classList.remove('visible');if(activeLabel)activeLabel.classList.remove('active');activeLabel=null}
$('popupClose').onclick=closePopup;document.addEventListener('keydown',e=>e.key==='Escape'&&closePopup());document.addEventListener('click',e=>{if(!popup.contains(e.target)&&!e.target.classList.contains('holiday-label'))closePopup();if(!$('datepickerTrigger').contains(e.target))$('datepickerPanel').classList.remove('open')});
function positionPopup(element){const rect=element.getBoundingClientRect(),width=330,gap=6,margin=10;let left=Math.min(Math.max(rect.left,margin),innerWidth-width-margin),top=rect.bottom+gap;popup.style.left=left+'px';popup.style.top=top+'px';requestAnimationFrame(()=>{if(top+popup.offsetHeight>innerHeight-margin)popup.style.top=Math.max(margin,rect.top-gap-popup.offsetHeight)+'px'})}
function formatDate(key){const [year,month,day]=key.split('-').map(Number);return`${monthsShort[month-1]} ${day}, ${year}`}
function showPopup(element,name,codes,date){
  if(activeLabel===element&&popup.classList.contains('visible'))return closePopup();closePopup();activeLabel=element;element.classList.add('active');
  const details=holidayDetails[date]?.[name]||{sources:[],types:[],states:[],scopes:[],description:''};
  const countries=codes.map(code=>countryData.find(c=>c.code===code)?.name||code),category=holidayCategory(details.types),workability=holidayWorkability(details.types),scope=holidayScope(details);
  popupTitle.textContent=name;
  popupMeta.innerHTML=`<span class="popup-tag date">${formatDate(date)}</span><span class="popup-tag scope">${scope}</span><span class="popup-tag ${workability.className}">${workability.label}</span>`+countries.map(country=>`<span class="popup-tag country">${country}</span>`).join('');
  popupBody.innerHTML=`<div class="detail-row"><div class="detail-label">Category</div><div>${category}</div></div><div class="detail-row"><div class="detail-label">Scope</div><div>${scope}${details.states.length?`: ${details.states.join(', ')}`:''}</div></div><div class="detail-row"><div class="detail-label">Workability</div><div>${workability.label}<br><span style="color:var(--muted)">${workability.detail}</span></div></div>${details.description?`<div class="popup-description">${details.description}</div>`:''}`;
  popupFooter.textContent=`Sources: ${details.sources.join(' + ')||'Unavailable'}`;
  popup.classList.add('visible');positionPopup(element);
}

function startClocks(){clearInterval(clockInterval);if(countrySelect.value==='ALL'){clockDisplay.style.display='none';return}const country=countryData.find(c=>c.code===countrySelect.value);clockDisplay.style.display='flex';const tick=()=>clockDisplay.innerHTML=country.zones.map(zone=>`<div class="clock-item"><div class="clock-time">${new Date().toLocaleTimeString('en-GB',{timeZone:zone.tz,hour:'2-digit',minute:'2-digit',second:'2-digit'})}</div><div class="clock-label">${zone.label}</div></div>`).join('');tick();clockInterval=setInterval(tick,1000)}
function renderCalendar(){
  closePopup();calendarGrid.innerHTML='';const year=+yearSelect.value,month=+monthSelect.value,firstDay=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),all=countrySelect.value==='ALL';let currentYear,currentMonth,currentDay,dateContext;
  if(all){const now=new Date;currentYear=now.getFullYear();currentMonth=now.getMonth()+1;currentDay=now.getDate();dateContext=now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})+' (Local Time)';clockDisplay.style.display='none'}else{const country=countryData.find(c=>c.code===countrySelect.value),parts=new Intl.DateTimeFormat('en-CA',{timeZone:country.zones[0].tz,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date).split('-').map(Number);[currentYear,currentMonth,currentDay]=parts;dateContext=new Date().toLocaleDateString('en-GB',{timeZone:country.zones[0].tz,day:'2-digit',month:'short',year:'numeric'});startClocks()}
  localDateDisplay.textContent=dateContext;const todayKey=`${currentYear}-${String(currentMonth).padStart(2,'0')}-${String(currentDay).padStart(2,'0')}`;dailyStatus.textContent=currentHolidays[todayKey]?Object.keys(currentHolidays[todayKey]).join(' | '):'Nothing';
  for(let i=0;i<firstDay;i++)calendarGrid.insertAdjacentHTML('beforeend','<div class="day-cell empty"></div>');
  for(let day=1;day<=days;day++){
    const date=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`,cell=document.createElement('div');cell.className='day-cell'+(year===currentYear&&month+1===currentMonth&&day===currentDay?' today':'')+(selectedDate&&year===selectedDate.year&&month===selectedDate.month&&day===selectedDate.day?' selected':'');
    let list='';for(const [name,codes] of Object.entries(currentHolidays[date]||{})){const sources=holidayDetails[date]?.[name]?.sources||[],dot=sources.length>1?'both':'single';list+=`<div class="holiday-label" data-name="${name.replace(/"/g,'&quot;')}" data-date="${date}" data-codes="${codes.join(',')}">${name}${all?`<span class="country-tag">(${codes.join(',')})</span>`:''}<i class="source-dot ${dot}" title="${sources.join(' + ')}"></i></div>`}
    cell.innerHTML=`<div class="day-number">${day}</div><div class="holiday-list">${list}</div>`;calendarGrid.appendChild(cell);
  }
  calendarGrid.querySelectorAll('.holiday-label').forEach(element=>element.onclick=event=>{event.stopPropagation();showPopup(element,element.dataset.name,element.dataset.codes.split(','),element.dataset.date)});updateNavTitle();
}

const datepicker=$('datepickerPanel');let datepickerState={year:new Date().getFullYear(),month:new Date().getMonth()};
$('datepickerBtn').onclick=event=>{event.stopPropagation();datepickerState={year:+yearSelect.value,month:+monthSelect.value};renderDatepicker();datepicker.classList.toggle('open')};
function renderDatepicker(){const {year,month}=datepickerState,first=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate(),now=new Date;datepicker.innerHTML=`<div class="dp-header"><button id="dpPrev">&#8249;</button><span class="dp-title">${months[month]} ${year}</span><button id="dpNext">&#8250;</button></div><div class="dp-weekdays"><div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div></div><div class="dp-days">${'<div class="dp-day empty"></div>'.repeat(first)}${Array.from({length:days},(_,i)=>`<div class="dp-day${year===now.getFullYear()&&month===now.getMonth()&&i+1===now.getDate()?' dp-today':''}" data-day="${i+1}">${i+1}</div>`).join('')}</div>`;$('dpPrev').onclick=e=>{e.stopPropagation();if(--datepickerState.month<0){datepickerState.month=11;datepickerState.year--}renderDatepicker()};$('dpNext').onclick=e=>{e.stopPropagation();if(++datepickerState.month>11){datepickerState.month=0;datepickerState.year++}renderDatepicker()};datepicker.querySelectorAll('.dp-day:not(.empty)').forEach(element=>element.onclick=e=>{e.stopPropagation();selectedDate={year,month,day:+element.dataset.day};if(setYear(year)){monthSelect.value=month;saveSelections();fetchHolidays()}datepicker.classList.remove('open')})}

$('todayBtn').onclick=()=>{selectedDate=null;const now=new Date;yearSelect.value=now.getFullYear();monthSelect.value=now.getMonth();saveSelections();fetchHolidays()};regionSelect.onchange=()=>{updateCountryList();saveSelections();fetchHolidays()};countrySelect.onchange=()=>{saveSelections();startClocks();fetchHolidays()};yearSelect.onchange=()=>{saveSelections();fetchHolidays()};monthSelect.onchange=()=>{saveSelections();renderCalendar()};
function init(){applyTheme(localStorage.getItem('holiday-theme')||'light');const now=new Date;for(let year=now.getFullYear()-1;year<=now.getFullYear()+4;year++)yearSelect.add(new Option(year,year));months.forEach((month,index)=>monthSelect.add(new Option(month,index)));const saved=loadSelections();regionSelect.value=saved?.region||'Americas';updateCountryList();countrySelect.value=[...countrySelect.options].some(o=>o.value===saved?.country)?saved.country:'AR';yearSelect.value=[...yearSelect.options].some(o=>o.value===String(saved?.year))?saved.year:now.getFullYear();monthSelect.value=saved?.month??now.getMonth();saveSelections();updateNavTitle();startClocks();fetchHolidays()}
init();
</script>
</body>
</html>
